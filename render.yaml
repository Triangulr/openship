services:
  - type: web
    name: openship-dashboard
    runtime: docker
    plan: 12c-96g
    region: singapore
    dockerfilePath: ./apps/dashboard/Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: PORT
        value: 3001
      - key: HOSTNAME
        value: 0.0.0.0
      - key: INTERNAL_API_URL
        value: http://openship-api:4000

  - type: pserv
    name: openship-api
    runtime: docker
    plan: 12c-96g
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: CLOUD_MODE
        value: false
      - key: DEPLOY_MODE
        value: bare
      - key: OPENSHIP_HOST_CONTROL
        value: false
      - key: OPENSHIP_REQUIRE_AUTH
        value: true
      - key: OPENSHIP_AUTH_MODE
        value: local
      - key: OPENSHIP_REQUIRE_REDIS
        value: true
      - key: TRUST_PROXY
        value: true
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: INTERNAL_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: openship-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: openship-redis
          property: connectionString
      - key: OPENSHIP_PUBLIC_URL
        value: https://openship-dashboard.onrender.com
      - key: OPENSHIP_EXTRA_TRUSTED_ORIGINS
        value: https://openship-dashboard.onrender.com

  - type: keyvalue
    name: openship-redis
    plan: 1g
    region: singapore
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

databases:
  - name: openship-postgres
    plan: 0.5c-1g
    region: singapore
    databaseName: openship
    user: openship
    ipAllowList: []
